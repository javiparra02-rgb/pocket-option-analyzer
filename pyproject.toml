[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-option-analyzer"
version = "0.1.0"
description = "Professional real-time Pocket Option chart analyzer."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

authors = [
    { name = "Mauricio Viera Flores" }
]

keywords = [
    "python",
    "opencv",
    "trading",
    "computer-vision",
    "pocket-option"
]

dependencies = [
    "numpy>=2.2",
    "opencv-python>=4.11",
    "mss>=10.0",
    "PySide6>=6.9",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "loguru>=0.7",
    "python-dotenv>=1.1"
]

[project.optional-dependencies]

dev = [
    "black>=25.1",
    "ruff>=0.12",
    "mypy>=1.16",
    "pytest>=8.4",
    "pytest-cov>=6.2"
]

[tool.black]

line-length = 88
target-version = ["py312"]

[tool.ruff]

line-length = 88
target-version = "py312"

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "N",
]

[tool.pytest.ini_options]

testpaths = [
    "tests"
]

[tool.mypy]

python_version = "3.12"

strict = true

warn_unused_configs = true

disallow_untyped_defs = true

ignore_missing_imports = true

[tool.setuptools]

package-dir = { "" = "src" }

[tool.setuptools.packages.find]

where = [
    "src"
]